# API Sherlock: API + PostgreSQL
# Usage: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sherlock
      POSTGRES_PASSWORD: sherlock
      POSTGRES_DB: api_sherlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sherlock -d api_sherlock"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://sherlock:sherlock@db:5432/api_sherlock
      API_KEY: ${API_KEY:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ALLOW_PRIVATE_HOSTS: ${ALLOW_PRIVATE_HOSTS:-false}
      ENVIRONMENT: development
    ports:
      - "8000:8000"

volumes:
  pgdata: